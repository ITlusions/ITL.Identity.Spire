# Overrides for the upstream "spire" dependency only - every key not set
# here keeps upstream's own default (see
# https://github.com/spiffe/helm-charts-hardened/blob/spire-0.30.4/charts/spire/values.yaml
# for the full set). This file is deliberately short - that's the point of
# wrapping instead of hand-rolling: upstream owns the manifests, we only
# own the handful of values that are actually cluster-specific.
spire:
  global:
    spire:
      # SPIFFE trust domain - deliberately NOT a resolvable public hostname
      # (SPIFFE trust domains don't need to be). This is the permanent root
      # of every SVID this cluster issues - confirm before first deploy,
      # changing it later means re-issuing every workload identity.
      # "itlusions.local" marks this cluster specifically, distinct from
      # any other ITL cluster that might run its own SPIRE server with its
      # own trust domain.
      trustDomain: "itlusions.local"

      # Must match however this Talos cluster identifies itself to the
      # k8s_psat NodeAttestor - placeholder, confirm before relying on it
      # for node attestation.
      clusterName: "itl-talos"

      namespaces:
        create: true

      # The ONE place this must be set - spire-server and
      # spiffe-oidc-discovery-provider each have their own LOCAL jwtIssuer
      # value, and spire-lib's own helper template (spire-lib.jwt-issuer)
      # checks global.spire.jwtIssuer FIRST, falling back to whichever
      # subchart's local value only if this is empty. Setting only the
      # discovery-provider's local value (an earlier mistake, confirmed
      # live: the discovery document advertised this hostname while every
      # actually-minted JWT-SVID still carried the untouched default,
      # https://oidc-discovery.<trustDomain>, in its `iss` claim - two
      # different strings, same signing key) never reaches spire-server at
      # all, since each subchart's own .Values.jwtIssuer is a separate,
      # unrelated value from this global one. Setting it HERE makes both
      # subcharts agree, by design.
      jwtIssuer: "https://trust.itlusions.com"

      persistence:
        # ha-gen-lh, not ha-secure-lh - see ITL.Wireguard/ITL.Headscale
        # README for why (broken Longhorn StorageClass parameter on this
        # cluster, confirmed 2026-10-23, unrelated to this chart).
        storageClass: "ha-gen-lh"

  spire-server:
    # The actual HA switch - only safe now that dataStore below is Postgres, not SQLite.
    replicaCount: 2

    # Chains SPIRE's own X.509 authority under ITL.CertManager.CA's root instead of staying
    # self-signed - one real root of trust for the cluster, not two independent ones. Requests
    # its own intermediate via a CertificateRequest against the dedicated
    # itl-spire-upstream-ca-issuer (ITL.CertManager.CA's own values.yaml, "spire" intermediate -
    # never shared with the database-client or workload intermediates, same trust-boundary
    # separation as those two). ca.create left false deliberately: that issuer and its
    # intermediate already exist, created by ITL.CertManager.CA itself - this plugin only
    # requests a cert FROM it, it does not create the issuer.
    upstreamAuthority:
      certManager:
        enabled: true
        issuerName: itl-spire-upstream-ca-issuer
        issuerKind: ClusterIssuer
        issuerGroup: cert-manager.io

    # HA prerequisite - upstream's own values.yaml says outright that scaling replicaCount
    # above 1 does not work on sqlite3 (its own default). Migrated live from the single SQLite
    # file (spirePostgres below is the CNPG cluster that datastore now lives in) - verified
    # byte-for-byte on the trust bundle and ca_journals (the actual root CA/JWT key material)
    # and row-count-exact on every other table before this cutover, not a fresh start.
    # externalSecret, not an inline password, reads the DBPW straight from CNPG's own
    # generated app Secret - confirmed live this is exactly what
    # spire-server.datastore-postgres-passwordless's own logic expects to wire DBPW from.
    dataStore:
      sql:
        databaseType: postgres
        databaseName: spire
        host: spire-postgres-rw
        username: spire
        externalSecret:
          enabled: true
          name: spire-postgres-app
          key: password
        options:
          - sslmode: require

    # CA certificate's own subject (not the leaf-SVID subject, which stays
    # at SPIRE's own default "O=SPIRE, C=US" - that one isn't exposed by
    # this chart or the ClusterSPIFFEID CRD, see docs discussion). This
    # only identifies this trust domain's root CA as ITlusions, NL.
    caSubject:
      country: NL
      organization: ITlusions
      commonName: itlusions.local

    # Enabled by default upstream - kept explicit here since it's the
    # mechanism this org would use later to manage registration entries as
    # CRDs/manifests (matching this org's GitOps pattern) instead of
    # one-off `spire-server entry create` CLI calls.
    controllerManager:
      enabled: true
      identities:
        clusterSPIFFEIDs:
          # Upstream's own catch-all ClusterSPIFFEID: an empty
          # namespaceSelector matches every namespace/serviceaccount in the
          # cluster, so leaving this at its upstream default (enabled)
          # auto-registers every existing and future workload the moment
          # the controller-manager starts - confirmed live, it produced 98
          # registration entries within minutes of first install, for
          # workloads that never asked for an identity (Longhorn, Forgejo,
          # Keycloak, Matrix, Nextcloud, OpenProject, MetalLB, CNPG, ...).
          #
          # Re-enabled 2026-10-29, deliberately, reversing the above: chosen
          # over ITL.Kyverno's annotation-driven spiffe-helper-inject policy
          # (now disabled there) as the more transparent mechanism -
          # registration via this default is native, visible SPIRE state
          # (`spire-server entry show`), not an admission-time mutation a
          # reader has to know Kyverno exists to find. Every workload now
          # gets an identity *issued* automatically again; nothing
          # auto-injects the spiffe-helper sidecar that turns that identity
          # into usable files - each consuming app's own chart still does
          # that explicitly (see ITL.Openproject.fork), same as before.
          default:
            enabled: true
            # Added 2026-10-29: makes the leaf SVID's CN match the issuing
            # workload's own app.kubernetes.io/name label, cluster-wide -
            # SPIRE always overwrites the CN with DNSNames[0] whenever any
            # DNS name is set (confirmed in SPIRE's own
            # pkg/server/credtemplate/builder.go). This is the same trick
            # ITL.Openproject.fork's own ClusterSPIFFEID uses
            # (dnsNameTemplates: ["openproject"], hardcoded to one app) to
            # make Postgres' clientcert=verify-full - which matches on CN,
            # not SAN-URI - usable, but applied here generically via every
            # workload's own label instead of one hardcoded name per app.
            # Any pod missing that label gets a podEntryRenderFailure for
            # just that one entry (visible in `kubectl get clusterspiffeid
            # itl-spire-spire-default -o yaml`'s .status.stats), not a
            # cluster-wide failure.
            # First attempt (same day) used a bare
            # '{{ index .PodMeta.Labels "app.kubernetes.io/name" }}' - confirmed live, it
            # broke 33 real workloads (Longhorn among them) that don't carry that label:
            # the template renders to an empty string rather than failing to render, and
            # SPIRE server then rejects the WHOLE entry update outright ("rpc error: code
            # = InvalidArgument desc = failed to convert entry: invalid DNS name: empty or
            # only whitespace") - not a soft per-entry render failure
            # (podEntryRenderFailures stayed 0 throughout; this showed up as
            # status.stats.entryFailures instead), so those 33 workloads briefly lost
            # their identity update entirely, not just the DNS name. Fixed with an
            # if/else fallback so the template can never render empty.
            #
            # Namespace-prefixed, not app.kubernetes.io/name alone: confirmed live that
            # label alone collides across unrelated workloads - forgejo-db, matrix-synapse-db,
            # mas-db and nextcloud-db (all separate CNPG Postgres clusters, different
            # namespaces) all carry app.kubernetes.io/name=postgresql. Harmless today (nothing
            # else uses CN-based cert auth yet besides ITL.Openproject.fork, which sets its own
            # explicit dnsNameTemplates and isn't affected), but the same
            # SPIFFE-ID-already-uses-this-exact-pattern (ns/{namespace}/sa/{serviceaccount})
            # reasoning that makes the SPIFFE ID itself collision-free applies here too -
            # giving the CN the same namespace-scoping removes the collision structurally
            # instead of relying on it staying harmless by luck.
            dnsNameTemplates:
              - '{{ .PodMeta.Namespace }}-{{ if index .PodMeta.Labels "app.kubernetes.io/name" }}{{ index .PodMeta.Labels "app.kubernetes.io/name" }}{{ else }}workload{{ end }}'

    # Tornjak - the SPIFFE project's own web UI for SPIRE (registration entries, agents,
    # trust bundle), since spire-server itself is CLI-only (see docs/1-operations/1.1-spire-cli.md).
    # Already a conditional dependency of the upstream "spire" chart this wrapper tracks
    # (charts/spire/Chart.yaml: `condition: tornjak-frontend.enabled`) - no new Chart.yaml
    # dependency needed, just the two enable flags upstream ships disabled by default.
    #
    # No Ingress here on purpose: upstream's own `auth.enabled` default is `false` on both
    # the backend and frontend - this is a full-CRUD admin UI over every registration entry
    # in the cluster with no login at all. Reach it via `kubectl port-forward` until an
    # auth provider is actually wired up (`tornjak.config.userManagement`/`auth.serverURL`),
    # not by adding an Ingress and treating "nobody knows the URL" as access control.
    tornjak:
      enabled: true
      # SQLite (upstream's own default) - matches this chart's own "Why SQLite" reasoning
      # in the README (single-server control plane, no separate Postgres for a UI's own
      # bookkeeping data).

  spire-agent:
    enabled: true

  # OIDC discovery provider - exposes the trust domain's JWKS/discovery document
  # publicly so a relying party (Keycloak, in a later phase) can validate
  # JWT-SVID signatures without talking to spire-server directly. Already a
  # conditional dependency of upstream's own "spire" chart (same level as
  # spire-server/spire-agent/tornjak-frontend above, condition:
  # spiffe-oidc-discovery-provider.enabled), enabled by upstream's own default
  # - confirmed live, the pod (spire-spiffe-oidc-discovery-provider) was
  # already running before this wrapper ever set a value for it. Only the
  # cluster-specific bits are overridden here: the public issuer URL and the
  # Ingress that exposes it.
  spiffe-oidc-discovery-provider:
    # jwtIssuer is set at global.spire.jwtIssuer above, NOT here - see that
    # key's own comment for why a local override on just this subchart
    # doesn't reach spire-server's own separate local value (confirmed live,
    # the actual root cause of the issuer-mismatch bug this replaced).
    config:
      # "use":"sig" on every JWK - upstream's own values.yaml calls this out
      # by name as "required for Keycloak SPIFFE provider", which is exactly
      # the later phase this is laying groundwork for.
      setKeyUse: true
    tls:
      spire:
        # Upstream's own default (true) wraps the provider's own listener in
        # a SPIRE-issued (self-signed, this trust domain's own CA) serving
        # cert - fine pod-to-pod, but Traefik can't terminate a public
        # Let's-Encrypt-backed hostname in front of that without either
        # passthrough (defeats the public cert) or a backend CA Traefik
        # doesn't have. Disabled here so the provider instead runs the
        # upstream-provided plain-HTTP nginx sidecar (insecureScheme.nginx,
        # port 8080) behind the Service - same edge-TLS-only shape already
        # used for Tornjak's own Ingress in this wrapper (see
        # templates/tornjak-ingress.yaml), and appropriate here since this
        # endpoint is meant to be public anyway. The trust bundle itself is
        # still read from the CSI driver mount regardless of this setting -
        # only the provider's own serving cert is affected.
        enabled: false
    ingress:
      enabled: true
      className: itl-traefik
      host: "trust.itlusions.com"
      # Required for cert-manager to provision a cert via the clusterIssuer
      # annotation below - upstream's own ingress-spec helper only emits a
      # `tls:` block's secretName when tlsSecret is set explicitly.
      tlsSecret: "spire-trust-oidc-tls"
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-issuer
        traefik.ingress.kubernetes.io/router.entrypoints: web, websecure

  # tornjak-frontend is itself a dependency of the upstream "spire" chart (same level as
  # spire-server/spire-agent above), not of this wrapper directly - confirmed live the hard
  # way: setting this as a top-level key in this file renders nothing at all, Helm only
  # passes it through when nested under `spire:` same as every other override here.
  tornjak-frontend:
    enabled: true
    # Must be reachable from the BROWSER running this (client-side JS), not from inside the
    # frontend pod - confirmed live that leaving this blank ("auto-detection") does not work
    # across two separate `kubectl port-forward` tunnels on different local ports (3000 for
    # the frontend, 10000 for the backend): every /api/v1/* call returns 200, but it's the
    # frontend's own SPA catch-all route serving index.html back (client-side routing
    # fallback for any unmatched path) - not the real backend, which saw zero requests in its
    # own log the whole time. The frontend then tries to parse that HTML as JSON and fails
    # silently, producing a blank page with no visible error. Matches the port-forward
    # command actually used to reach the backend (see README "Verify"/Tornjak section) -
    # update this if that port ever changes.
    apiServerURL: "https://spire-ui.itlusions.com"

# Exposes Tornjak's frontend UI via real Ingress/TLS instead of kubectl port-forward.
# Rendered by templates/tornjak-ingress.yaml and templates/tornjak-basic-auth-secret.yaml -
# this wrapper's own resources, not part of the upstream spire dependency (which has no
# Ingress of its own for either component beyond a bare enable flag).
#
# The backend gets NO hostname/DNS/cert of its own - deliberately kept off the public
# internet as its own addressable thing. The browser still needs to reach it somehow
# (apiServerURL above is same-origin, not localhost), so this one Ingress routes BOTH
# paths: "/" to the frontend Service, "/api" to the backend Service - one hostname, one
# cert, one basicAuth gate, but the backend is reachable only through that one path under
# that one gated hostname, never on its own.
#
# Gated with Traefik basicAuth specifically because Tornjak itself ships with
# `auth.enabled: false` on both the backend and frontend - without this, the Ingress alone
# would be a full-CRUD admin UI over every SPIFFE identity in the cluster, reachable by
# anyone who finds the hostname. A single shared admin/password pair, not Keycloak OIDC -
# simpler to stand up, and this is a single-operator admin tool, not a multi-user app.
tornjakIngress:
  enabled: true
  className: itl-traefik
  clusterIssuer: letsencrypt-issuer
  host: spire-ui.itlusions.com
  basicAuth:
    secretName: tornjak-basic-auth
    username: admin

# Declarative registration entries, rendered as ClusterSPIFFEID CRDs by
# templates/clusterspiffeid.yaml - the GitOps-friendly alternative to the
# one-off `spire-server entry create` CLI call in the README. Empty by
# default: this chart is infrastructure-only until something actually
# needs an SVID (see README "Open items" - no consumer wired up yet).
#
# Each item maps close to 1:1 onto ClusterSPIFFEID's own spec fields
# (spire-controller-manager CRD) - only `name` and `spiffeIDTemplate` are
# required by this template, everything else is optional and passed
# through as-is. Example, commented out, translating the README's CLI
# fallback for a single namespace+serviceaccount workload into a CRD:
#
# registrationEntries:
#   - name: example-workload
#     spiffeIDTemplate: "spiffe://itlusions.local/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
#     podSelector:
#       matchLabels:
#         spiffe.io/svid: "true"
#     namespaceSelector:
#       matchLabels:
#         kubernetes.io/metadata.name: example-namespace
# A CNPG Postgres cluster for spire-server's own datastore - the prerequisite for HA
# (spire-server.replicaCount > 1), since upstream's own chart is explicit SQLite cannot be
# shared across replicas. Deliberately created and left disabled by default here -
# `spirePostgres.enabled: true` only stands up the Postgres cluster itself, additive and
# harmless to the live SQLite-backed server; it does NOT migrate data or cut spire-server over
# to it - that's a separate, deliberate step (see docs/1-operations, once written) only taken
# after the migration has been proven against a copy of the live SQLite data.
spirePostgres:
  enabled: false
  instances: 2
  storageClass: ha-gen-lh
  storageSize: 2Gi

registrationEntries:
  # Throwaway PoC (docs/2026-10-29-first-workload-poc.md step 1), proving
  # the SPIFFE chain end-to-end before touching any real workload. Remove
  # this entry once docs/2026-10-29-first-workload-poc.md step 2 is done.
  - name: spire-poc-test
    spiffeIDTemplate: "spiffe://itlusions.local/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
    podSelector:
      matchLabels:
        app: spire-poc-test
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: spire-poc
