{{- if .Values.tornjakIngress.enabled }}
# Generates the credentials gating Tornjak's own Ingress (see values.yaml's own comment on
# why - Tornjak ships with no auth of its own). TWO SEPARATE Secrets, not one with two keys -
# confirmed live that Traefik's basicAuth Middleware rejects a Secret with more than one data
# key outright ("found 2 elements for secret ..., must be single element exactly"), it has no
# concept of "read this one specific key out of several":
#   - "<secretName>": single key "users", the htpasswd-format line Traefik actually reads
#   - "<secretName>-password": single key "password", the plaintext - the htpasswd hash is
#     one-way by design, so this is the only place the real password exists for the operator
#     to actually retrieve after this Job runs
#
# Same lookup+randAlphaNum idiom as examples/svid-toggle-demo's oidc-client-secret.yaml -
# generate once on first install, reuse the existing value across every `helm upgrade`
# rather than rotating it (and breaking whoever already has it saved) on every redeploy.
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-password" .Values.tornjakIngress.basicAuth.secretName) }}
{{- $password := "" }}
{{- if $existing }}
  {{- $password = index $existing.data "password" | b64dec }}
{{- end }}
{{- if not $password }}
  {{- $password = randAlphaNum 24 }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-tornjak-basic-auth
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-tornjak-basic-auth
      restartPolicy: Never
      containers:
        - name: build-secret
          image: alpine/k8s:1.37.1   # matches this cluster's actual server version, same image as examples/svid-toggle-demo's own admin Jobs - has kubectl, not htpasswd, hence the apk add below
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Confirmed live: Alpine's python3 package has no `crypt` module (needs
              # libxcrypt built in, which this package doesn't ship) - apache2-utils'
              # actual htpasswd binary is the more direct tool for this anyway.
              apk add --no-cache apache2-utils >/dev/null
              HTPASSWD_LINE=$(htpasswd -nbm {{ .Values.tornjakIngress.basicAuth.username }} '{{ $password }}')
              kubectl create secret generic {{ .Values.tornjakIngress.basicAuth.secretName }} -n {{ .Release.Namespace }} \
                --from-literal=users="$HTPASSWD_LINE" \
                --dry-run=client -o yaml | kubectl apply -f -
              kubectl create secret generic {{ .Values.tornjakIngress.basicAuth.secretName }}-password -n {{ .Release.Namespace }} \
                --from-literal=password="{{ $password }}" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "Done. Username: {{ .Values.tornjakIngress.basicAuth.username }} - fetch the password with:"
              echo "kubectl get secret {{ .Values.tornjakIngress.basicAuth.secretName }}-password -n {{ .Release.Namespace }} -o jsonpath='{.data.password}' | base64 -d"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-tornjak-basic-auth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-tornjak-basic-auth
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.tornjakIngress.basicAuth.secretName | quote }}
      - {{ printf "%s-password" .Values.tornjakIngress.basicAuth.secretName | quote }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-tornjak-basic-auth
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-tornjak-basic-auth
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-tornjak-basic-auth
{{- end }}
