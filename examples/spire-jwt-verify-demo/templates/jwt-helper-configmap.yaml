# Same spiffe-helper idiom as examples/svid-toggle-demo's own jwt-helper-configmap.yaml -
# deliberately unchanged, since the helper's job (fetch a JWT-SVID, write it to a file) is
# identical in both demos. Only what happens to the token AFTER this is different: the other
# demo's api decodes it unverified (or, optionally, exchanges it at Keycloak); this demo's api
# verifies its signature directly, no middleman.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-jwt-helper-config
data:
  spiffe-helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir = "/jwt-svid"
    jwt_svids = [
      {
        jwt_audience = "{{ .Values.api.jwtAudience }}"
        jwt_svid_file_name = "jwt_svid.token"
      }
    ]
