# Builds the Secret the frontend's exchange call reads (webapp-deployment.yaml) -
# client_id/client_secret for svid-toggle-demo-workload-exchange, the confidential client
# created directly via Keycloak's Admin REST API in ITL.Identity.Spire's Phase 2
# (docs/1-operations/1.4-keycloak-token-exchange.md), not via a KeycloakOIDCClient CR - so,
# unlike oauth2-proxy-secret-job.yaml's client secret, there's no Operator-managed Kubernetes
# Secret to read directly; this Job fetches it the same way a human would, via the Admin REST
# API, authenticating with the realm-management service account already used for Operator
# automation (itl-keycloak-admin, in Keycloak's own namespace - read via the same narrow
# cross-namespace RBAC pattern as oauth2-proxy-secret-job.yaml's own read of the Keycloak
# Operator's client secret). User explicitly approved this specific cross-namespace RBAC grant
# (narrow: read exactly one secret in itl-keycloak, write exactly one secret into this release's
# own namespace) - 2026-10-30.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-keycloak-exchange-secret
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-keycloak-exchange-secret
      restartPolicy: Never
      containers:
        - name: fetch-secret
          image: alpine/k8s:1.37.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache curl >/dev/null
              ADMIN_CLIENT_ID=$(kubectl get secret {{ .Values.keycloakExchange.adminSecretRef.name }} -n {{ .Values.keycloakExchange.adminSecretRef.namespace }} -o jsonpath='{.data.client-id}' | base64 -d)
              ADMIN_CLIENT_SECRET=$(kubectl get secret {{ .Values.keycloakExchange.adminSecretRef.name }} -n {{ .Values.keycloakExchange.adminSecretRef.namespace }} -o jsonpath='{.data.client-secret}' | base64 -d)
              ADMIN_TOKEN=$(curl -s -X POST "{{ .Values.keycloakExchange.issuerBase }}/realms/master/protocol/openid-connect/token" \
                -d grant_type=client_credentials -d client_id="$ADMIN_CLIENT_ID" -d client_secret="$ADMIN_CLIENT_SECRET" \
                | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)
              if [ -z "$ADMIN_TOKEN" ]; then echo "Failed to obtain an admin token"; exit 1; fi
              EXCHANGE_SECRET=$(curl -s -H "Authorization: Bearer $ADMIN_TOKEN" \
                "{{ .Values.keycloakExchange.issuerBase }}/admin/realms/{{ .Values.keycloakExchange.realm }}/clients/{{ .Values.keycloakExchange.clientUuid }}/client-secret" \
                | grep -o '"value":"[^"]*' | cut -d'"' -f4)
              if [ -z "$EXCHANGE_SECRET" ]; then echo "Failed to fetch the exchange client's secret"; exit 1; fi
              kubectl create secret generic {{ .Values.keycloakExchange.secretRef.name }} -n {{ .Release.Namespace }} \
                --from-literal=client_id={{ .Values.keycloakExchange.clientId }} \
                --from-literal=client_secret="$EXCHANGE_SECRET" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "Done."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-keycloak-exchange-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-keycloak-exchange-secret
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.keycloakExchange.secretRef.name | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-keycloak-exchange-secret
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-keycloak-exchange-secret
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-keycloak-exchange-secret
---
# Cross-namespace: narrow read on exactly one secret (the Keycloak Operator's own admin
# service-account credentials) in Keycloak's namespace - same posture as
# oauth2-proxy-secret-job.yaml's equivalent cross-namespace Role/RoleBinding pair.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-read-keycloak-admin-secret
  namespace: {{ .Values.keycloakExchange.adminSecretRef.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.keycloakExchange.adminSecretRef.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-read-keycloak-admin-secret
  namespace: {{ .Values.keycloakExchange.adminSecretRef.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-keycloak-exchange-secret
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-read-keycloak-admin-secret
