{{- $existing := lookup "v1" "Secret" .Values.authGateway.keycloak.namespace .Values.authGateway.keycloak.clientSecretRef.name }}
{{- $clientSecret := "" }}
{{- if $existing }}
  {{- $clientSecret = index $existing.data "client-secret" | b64dec }}
{{- end }}
{{- if not $clientSecret }}
  {{- $clientSecret = randAlphaNum 32 }}
{{- end }}
# Pre-created Secret the Keycloak Operator reads FROM, not writes INTO - confirmed live this
# chart's own earlier assumption (and ITL.AuthGateway's README's open question) was backwards:
# the operator does not generate a secret for a KeycloakOIDCClient at all. It takes whatever
# value already sits in this key and pushes it to Keycloak as the client's secret, erroring
# ("auth.secret: must not be blank") if the value is empty. So this chart generates the value
# itself, via Helm's `lookup` (reusing whatever is already there across upgrades, rather than
# rotating the secret - and therefore invalidating every oauth2-proxy session - on every
# `helm upgrade`) falling back to `randAlphaNum` only on a genuine first install. Label and
# overall shape confirmed against an existing, working client in this same cluster
# (openproject-lab's own secret) - though that one turned out to have been seeded with a real
# value some other way already, not actually generated by the operator either.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.authGateway.keycloak.clientSecretRef.name }}
  namespace: {{ .Values.authGateway.keycloak.namespace }}
  labels:
    operator.keycloak.org/kind: KeycloakOIDCClient
type: Opaque
stringData:
  client-secret: {{ $clientSecret | quote }}
