# Builds the Secret ITL.AuthGateway's oauth2-proxy Deployment reads via envFrom
# (authGateway.oauth2Proxy.clientSecretRef) - OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET,
# OAUTH2_PROXY_COOKIE_SECRET. That chart's own README is explicit it does NOT create this secret
# itself ("No secret generation... expects you... to have created the Secret"), so this example
# does, from two sources: the client ID (a fixed value this chart already knows,
# authGateway.keycloak.clientId) and the client secret the Keycloak Operator auto-creates for its
# own KeycloakOIDCClient CR - confirmed live by checking an existing client (openproject-lab)'s
# own secret, key "client-secret" - under a DIFFERENT key name
# (authGateway.keycloak.clientSecretRef) than oauth2-proxy expects, hence this Job, not a direct
# reference.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-oauth2-proxy-secret
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-oauth2-proxy-secret
      restartPolicy: Never
      containers:
        - name: build-secret
          image: alpine/k8s:1.37.1   # matches this cluster's actual server version, confirmed 2026-10-30
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Waiting for the Keycloak Operator's own client secret..."
              until kubectl get secret {{ .Values.authGateway.keycloak.clientSecretRef.name }} -n {{ .Values.authGateway.keycloak.namespace }} >/dev/null 2>&1; do
                sleep 2
              done
              CLIENT_SECRET=$(kubectl get secret {{ .Values.authGateway.keycloak.clientSecretRef.name }} -n {{ .Values.authGateway.keycloak.namespace }} -o jsonpath='{.data.client-secret}' | base64 -d)
              # Reusing an existing cookie secret if this Job has already run before (helm
              # upgrade) - rotating it on every upgrade would invalidate every active browser
              # session for no reason.
              COOKIE_SECRET=$(kubectl get secret {{ .Values.authGateway.oauth2Proxy.clientSecretRef.name }} -n {{ .Release.Namespace }} -o jsonpath='{.data.OAUTH2_PROXY_COOKIE_SECRET}' 2>/dev/null | base64 -d || true)
              if [ -z "$COOKIE_SECRET" ]; then
                # openssl isn't in this image (confirmed live: "openssl: not found") -
                # /dev/urandom + base64 needs nothing extra. Also covers the case where a
                # previous run of this exact Job wrote an empty value (confirmed live this
                # happened once already) - checking non-empty, not merely "does the secret
                # exist", is what actually prevents that from becoming permanent.
                COOKIE_SECRET=$(head -c 32 /dev/urandom | base64 | head -c 32)
              fi
              kubectl create secret generic {{ .Values.authGateway.oauth2Proxy.clientSecretRef.name }} -n {{ .Release.Namespace }} \
                --from-literal=OAUTH2_PROXY_CLIENT_ID={{ .Values.authGateway.keycloak.clientId }} \
                --from-literal=OAUTH2_PROXY_CLIENT_SECRET="$CLIENT_SECRET" \
                --from-literal=OAUTH2_PROXY_COOKIE_SECRET="$COOKIE_SECRET" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "Done."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-oauth2-proxy-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-oauth2-proxy-secret
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.authGateway.oauth2Proxy.clientSecretRef.name | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-oauth2-proxy-secret
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-oauth2-proxy-secret
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-oauth2-proxy-secret
---
# Cross-namespace: narrow read on exactly one secret in the Keycloak CR's own namespace -
# same security posture as ITL.CertManager.CA's own sync-ca Job (a real client secret, not a
# public value, so no broad system:authenticated-style grant).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-read-oidc-client-secret
  namespace: {{ .Values.authGateway.keycloak.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.authGateway.keycloak.clientSecretRef.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-read-oidc-client-secret
  namespace: {{ .Values.authGateway.keycloak.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-oauth2-proxy-secret
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-read-oidc-client-secret
